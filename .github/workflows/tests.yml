# Runs the pytest acceptance suite on every PR and push to main.
#
# The suite is self-contained: it builds a synthetic sandbox (fake CSVs +
# small random numpy embeddings) and exercises the pipeline scripts against it.
# It needs only pytest + numpy — the heavy ML dependencies in requirements.txt
# (torch, nudenet, onnxruntime, …) and the macOS-only osxphotos/photoscript are
# imported lazily and are not exercised here, so CI stays fast and runs on Linux.
name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (acceptance suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run acceptance tests
        run: python -m pytest tests/ -q
